                {

                },
                {
                    "@type": "WebSite",
                    "@id": "https://www.purecanvas.app/#website",

                },
                {
                    "@type": "WebPage",
                    "@id": "https://www.purecanvas.app/#webpage",
                    "url": "https://www.purecanvas.app/",
                    "name": "PureCanvas - free design.",
                    "description": "PureCanvas — a local-first vector design app for the browser. Draw shapes, text, images, lines, icons and freehand strokes, then export to SVG, PNG or WEBP.",

                },
                {
                    "@type": "SoftwareApplication",
                    "@id": "https://www.purecanvas.app/#software",

    </head>
    <body>
        <noscript>
            <main
                style="max-width: 48rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.6;"
            >
                <h1>PureCanvas - free design.</h1>
                <p>
                    A local-first vector design app for the browser. Draw shapes, text, images,
                    lines, icons and freehand strokes, then export to SVG, PNG or WEBP. Everything
                    is stored locally in your browser via IndexedDB — no account, no server, no
                    uploads.
                </p>
                <h2>Features</h2>
                <ul>
                    <li>Infinite canvas with adaptive dot grid, pan and zoom</li>
                    <li>Tools: Select, Text, Image, Line, Shape, Icon, Pen</li>
                    <li>Layers, undo/redo, and keyboard shortcuts</li>
                    <li>Export to SVG, PNG, WEBP, or copy to clipboard</li>
                    <li>Light and dark themes</li>
                </ul>
                <p><strong>JavaScript is required to use the editor.</strong></p>
            </main>
        </noscript>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
